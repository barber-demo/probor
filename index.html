<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Запись онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  ДВИЖОК ПРИЛОЖЕНИЯ. Под конкретного клиента этот файл не редактируется:
  все данные барбершопа — в config.js, фото — в папке images/.
-->
<style>
:root{--display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--bg:#0e0e0f;--card:#1a1a1c;--line:#2b2b2e;--text:#f1ebe0;--mut:#a29b8f;--gold:#c8a15a;--beige:#e4d4b4;--r:20px;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
/* страница всегда чуть выше экрана: иначе iOS Safari на коротких страницах поднимает нижнее меню */
body{min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
body{background:var(--bg);color:var(--text);font:400 15px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15}
h2{font-size:28px;margin:34px 0 14px}h3{font-size:21px}
p{color:var(--mut)}
img{display:block;width:100%;height:100%;object-fit:cover}
.art,.ph,.opt .ic{position:relative}.art img,.ph img,.opt .ic img{position:absolute;inset:0}
/* единый стиль фото: ч/б + тёплый оттенок акцента */
.toned .art img,.toned .ph img,.toned .opt .ic img,.toned .hero-bg,.bw .art img,.bw .ph img,.bw .opt .ic img,.bw .hero-bg{filter:grayscale(1) contrast(1.12) brightness(.8)}
.toned .art:has(img)::after,.toned .ph:has(img)::after,.toned .ic:has(img)::after{content:'';position:absolute;inset:0;background:var(--gold);mix-blend-mode:color;opacity:.45;pointer-events:none}
.wrap{max-width:960px;margin:auto;padding:0 18px;position:relative;z-index:1}
#decor{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.view{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:center;gap:12px;padding:16px 0}
.logo{flex:0 0 44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:700 17px var(--display);color:var(--gold)}
.brand{font:700 21px var(--display);letter-spacing:.2em;line-height:1.2}
.brand small{display:block;font:400 11px Manrope,sans-serif;letter-spacing:.04em;color:var(--mut)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 24px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;border:1px solid var(--line);background:radial-gradient(110% 80% at 90% 0,color-mix(in srgb,var(--gold) 28%,transparent),transparent 62%),linear-gradient(160deg,#252527,#0f0f10);background-size:cover;background-position:center}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:46px;max-width:11ch}
.hero p{max-width:min(34ch,calc(100% - 64px));color:#d8d0c2}
.hero.photo p{max-width:34ch}
.hero-bg,.hero-shade{position:absolute!important;inset:0;z-index:0!important}.hero-bg{background-size:cover;background-position:center}
.hero-shade{background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.35) 30%,color-mix(in srgb,var(--bg) 95%,transparent) 82%)}
body:not(.toned) .ph svg{filter:grayscale(1) brightness(.9)}
h3.cat{font-size:24px;margin:26px 0 12px;color:var(--beige)}h3.cat:first-of-type{margin-top:0}
.pole{position:absolute!important;z-index:0!important;right:26px;top:-30px;width:46px;height:75%;border-radius:0 0 24px 24px;opacity:.9;background:repeating-linear-gradient(135deg,var(--gold) 0 12px,var(--bg) 12px 24px,var(--beige) 24px 36px,var(--bg) 36px 48px);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 15px Manrope,sans-serif;padding:15px 24px;border-radius:16px;color:#1a1612;background:linear-gradient(135deg,var(--beige),var(--gold));text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.ghost{background:rgba(14,14,15,.4);color:var(--beige);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn.sm{padding:10px 16px;font-size:14px;border-radius:12px}.btn.full{width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.art{aspect-ratio:16/10;border-radius:14px;display:grid;place-items:center;color:var(--gold);margin-bottom:14px;overflow:hidden;background:linear-gradient(135deg,#2e2a22,#19191b)}
.art svg{width:54px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.meta b{font:600 22px var(--display);color:var(--beige)}.meta span{color:var(--mut);font-size:13px}
.svc{display:flex;flex-direction:column}.svc p{flex:1}
.ph{height:220px;border-radius:14px;margin-bottom:14px;overflow:hidden;background:linear-gradient(160deg,#34302a,#1a1a1c)}
.ph svg{width:100%;height:100%}
.tag{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--beige);margin:0 6px 6px 0}
.adv{display:flex;gap:12px;align-items:flex-start}.adv svg{flex:0 0 26px;color:var(--gold)}
.adv b{display:block;font-weight:600}
.info{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.info:last-child{border:0}
.info svg{flex:0 0 22px;color:var(--gold);margin-top:2px}.info b{display:block;font-weight:600}
.info a{color:var(--text)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{background:none;border:0;color:var(--gold);font:500 14px Manrope,sans-serif;cursor:pointer;padding:6px 0;white-space:nowrap}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 24px));display:flex;z-index:20;padding:6px;border-radius:32px;touch-action:none;user-select:none;-webkit-user-select:none;
 background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(16,16,16,.42);backdrop-filter:blur(24px) saturate(190%) brightness(1.05);-webkit-backdrop-filter:blur(24px) saturate(190%) brightness(1.05);
 border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 18px rgba(255,255,255,.05),0 12px 32px rgba(0,0,0,.5)}
.nav::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 90% at 20% -30%,rgba(255,255,255,.22),transparent 55%),radial-gradient(80% 70% at 100% 130%,rgba(255,255,255,.08),transparent 60%)}
.nav a{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:26px;color:rgba(255,255,255,.62);text-decoration:none;font-size:11.5px;transition:color .25s;-webkit-user-drag:none;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.nav a.on{color:var(--gold)}.nav svg{width:22px;height:22px}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:26px;z-index:0;pointer-events:none;
 transform:translateX(var(--x,0px)) scale(var(--s,1));transition:transform .45s cubic-bezier(.3,1.35,.45,1);
 background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.22);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(0,0,0,.15),0 4px 14px rgba(0,0,0,.25);backdrop-filter:blur(6px) saturate(160%);-webkit-backdrop-filter:blur(6px) saturate(160%)}
.pill.drag{transition:transform .08s linear;--s:1.08}
/* запись */
.bk-h{display:flex;align-items:center;gap:10px;padding-top:6px}
.icon-b{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:18px}
.bar{height:8px;border-radius:8px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .4s;background:repeating-linear-gradient(135deg,var(--gold) 0 8px,var(--beige) 8px 16px)}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:.2s}
.opt .ic{flex:0 0 50px;height:50px;border-radius:14px;display:grid;place-items:center;color:var(--gold);background:#26241f;overflow:hidden}.opt .ic svg{width:28px}.opt .ic .ph{width:50px;height:50px;margin:0;border-radius:14px}
.opt .t{flex:1}.opt .t b{display:block;font-weight:600}.opt .t span{color:var(--mut);font-size:13px}.opt .p{font:600 19px var(--display);color:var(--beige);white-space:nowrap}
.sel{border-color:var(--gold)!important;background:color-mix(in srgb,var(--gold) 11%,transparent)!important}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.date{flex:0 0 58px;padding:10px 0;text-align:center;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.date:disabled{opacity:.3;cursor:not-allowed}
.date small{display:block;color:var(--mut);font-size:12px}.date b{font:600 21px var(--display)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer;transition:.15s}
.slot:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}
.lab{display:block;margin:0 0 6px;font-size:13px;color:var(--mut)}
.inp{width:100%;padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;margin-bottom:16px}.inp:focus{outline:0;border-color:var(--gold)}
.sum{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.sum:last-child{border:0}.sum span{color:var(--mut)}.sum b{font-weight:600;text-align:right}
.cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-top:14px;margin-top:14px;background:linear-gradient(transparent,var(--bg) 35%)}
.ok{text-align:center;padding-top:20px}
.ok .ring{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.map{height:200px;border-radius:var(--r);border:1px solid var(--line);background:#161617;position:relative;overflow:hidden}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;scroll-padding:0 18px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 72%;margin:0;aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;scroll-snap-align:start;background:var(--card);border:1px solid var(--line)}
.gal img{position:absolute;inset:0}.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:13px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cphoto{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--line)}.cphoto img{position:absolute;inset:0}
.tex .btn:not(.ghost),.tex .bar i{background:var(--tex) center/cover;color:#1b130b;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.tex .logo{border-width:2px}
/* кнопки «жидкое стекло» (buttons: "glass" в config.js) */
.glass .btn{position:relative;overflow:hidden;color:#fff;font-weight:600;text-shadow:0 1px 1px rgba(0,0,0,.35);
 background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.14)),color-mix(in srgb,var(--gold) 16%,transparent);
 border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 3px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);transition:transform .15s,box-shadow .2s,background .2s}
.glass .btn::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 120% at 15% -40%,rgba(255,255,255,.35),transparent 55%)}
.glass .btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 3px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.45)}
.glass .btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.25)}
.glass .btn:disabled{opacity:.35}
.glass .bar i,.glass .gbar i{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45));box-shadow:0 0 8px rgba(255,255,255,.25)}
.galw{position:relative}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:2;display:grid;place-items:center;transition:opacity .2s}
.gnav.prev{left:8px}.gnav.next{right:8px}.gnav:disabled{opacity:0;pointer-events:none}
.gbar{height:4px;background:var(--line);border-radius:4px;margin-top:14px;position:relative;overflow:hidden}
.gbar i{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--gold);transition:left .15s,width .15s}
.tex .gbar i{background:var(--tex) center/cover}
@media(min-width:700px){.gal{margin:0;padding:0 0 6px;scroll-padding:0}.gal figure{flex-basis:calc((100% - 24px)/3)}.gnav.prev{left:-14px}.gnav.next{right:-14px}}
.toned .gal img,.toned .cphoto img,.bw .gal img,.bw .cphoto img{filter:grayscale(1) contrast(1.12) brightness(.8)}
.note{margin:24px 0 0;font-size:12px;text-align:center;color:var(--mut)}
@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.hero{min-height:460px;padding:56px}.hero h1{font-size:68px}.pole{right:70px;width:64px}.slots{grid-template-columns:repeat(6,1fr)}.brand{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="decor" aria-hidden="true" hidden></canvas>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
  <p class="note" id="note"></p>
</div>
<nav class="nav" id="nav"></nav>

<script src="config.js"></script>
<script>
/* ===== ДАННЫЕ КЛИЕНТА (из config.js) ===== */
const C=window.BH_CONFIG;
const SERVICES=C.services, BARBERS=C.barbers, BK=C.booking||{};
const EXTERNAL=BK.mode==='external'&&BK.externalUrl;
const STEP=BK.slotStep||30;
const SHOW_DUR=C.showDuration===true; // показывать длительность услуг клиентам

/* ===== УТИЛИТЫ ===== */
const rub=n=>n.toLocaleString('ru-RU')+' ₽';
const priceLabel=s=>!s.price&&!s.priceTo?'Бесплатно':s.priceTo?s.price.toLocaleString('ru-RU')+'–'+rub(s.priceTo):rub(s.price);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(m/60|0)+':'+pad(m%60);
const toMin=s=>{const[h,m]=s.split(':');return +h*60+ +m};
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const svc=id=>SERVICES.find(s=>s.id===id), brb=id=>BARBERS.find(b=>b.id===id);
const hash=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x%100};
const IC={
 scissors:'<circle cx="22" cy="62" r="8"/><circle cx="58" cy="62" r="8"/><path d="M28 55L60 14M52 55L20 14"/>',
 razor:'<rect x="8" y="46" width="36" height="14" rx="6"/><path d="M44 48L70 30l2 7-24 20z"/>',
 comb:'<rect x="8" y="26" width="64" height="18" rx="4"/><path d="M16 44v16M26 44v16M36 44v16M46 44v16M56 44v16M64 44v16"/>',
 pin:'<path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
 home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 list:'<path d="M4 7h16M4 12h16M4 17h10"/>',star:'<path d="M12 3l2.7 5.5 6 .9-4.4 4.2 1 6L12 16.8 6.7 19.6l1-6L3.3 9.4l6-.9z"/>'};
const BIG=['scissors','razor','comb'];
const icon=(k,w=24)=>{k=IC[k]?k:'scissors';const big=BIG.includes(k);return `<svg viewBox="${big?'0 0 80 80':'0 0 24 24'}" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="${big?2.5:1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`};
const img=(src,alt)=>`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`; // если фото не загрузилось — остаётся заглушка под ним
const PAL=[['#2a2118','#d7b496'],['#171412','#c9a283'],['#5b4630','#e0c1a4'],['#3a2a1d','#cfa98a']];
const portrait=(b,i)=>{const[hair,skin]=PAL[i%PAL.length];return `<svg viewBox="0 0 200 190" preserveAspectRatio="xMidYMax slice" role="img" aria-label="${esc(b.name)}"><path d="M20 190c0-42 36-60 80-60s80 18 80 60z" fill="#2b2b2e"/><path d="M82 190l18-34 18 34z" fill="var(--beige)" opacity=".9"/><rect x="88" y="104" width="24" height="30" rx="8" fill="${skin}"/><ellipse cx="100" cy="82" rx="30" ry="36" fill="${skin}"/>${i%3===1?`<path d="M70 86c0 34 14 48 30 48s30-14 30-48c-6 14-16 18-30 18s-24-4-30-18z" fill="${hair}"/>`:''}<path d="M68 78c-4-34 14-50 34-50s32 18 28 50c-4-14-12-24-30-24s-26 10-32 24z" fill="${hair}"/></svg>`};
const barberPic=b=>portrait(b,BARBERS.indexOf(b))+(b.photo?img(b.photo,b.name):'');

/* ===== ГРАФИК РАБОТЫ ===== */
const WD=['sun','mon','tue','wed','thu','fri','sat'], WD_RU={mon:'Пн',tue:'Вт',wed:'Ср',thu:'Чт',fri:'Пт',sat:'Сб',sun:'Вс'};
const hoursOf=d=>C.schedule[WD[d.getDay()]]||null;
function hoursText(){const order=['mon','tue','wed','thu','fri','sat','sun'],v=k=>C.schedule[k]?C.schedule[k].join('–'):'выходной';
 const groups=[];order.forEach(k=>{const g=groups[groups.length-1];if(g&&g.v===v(k))g.to=k;else groups.push({from:k,to:k,v:v(k)})});
 if(groups.length===1)return 'Ежедневно, '+groups[0].v;
 return groups.map(g=>(g.from===g.to?WD_RU[g.from]:WD_RU[g.from]+'–'+WD_RU[g.to])+': '+g.v).join(', ')}
const days=Array.from({length:BK.daysAhead||14},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
const dayByKey=k=>days.find(d=>dkey(d)===k);
function slotsFor(k){const h=hoursOf(dayByKey(k));if(!h)return[];const out=[];for(let m=toMin(h[0]);m<toMin(h[1]);m+=STEP)out.push(m);return out}

/* ===== ДОСТУПНОСТЬ (демо) ===== */
const booked={}; // записи, сделанные в этой сессии
const free=(bid,k,i,n)=>{const sl=slotsFor(k),now=new Date();
 for(let j=0;j<n;j++){const x=i+j;if(x>=sl.length||hash(k+bid+x)<30||booked[k+bid+x])return false}
 return !(k===dkey(now)&&sl[i]<=now.getHours()*60+now.getMinutes()+30)};
const slotFree=(k,i,n)=>S.barber==='any'?BARBERS.some(b=>free(b.id,k,i,n)):free(S.barber,k,i,n);
const nSlots=()=>Math.ceil(svc(S.service).duration/STEP);
const firstOpen=(n=1)=>{const d=days.find(d=>{const k=dkey(d);return slotsFor(k).some((_,i)=>BARBERS.some(b=>free(b.id,k,i,n)))});return dkey(d||days[0])};
const fitDate=()=>{const n=nSlots();if(!slotsFor(S.date).some((_,i)=>slotFree(S.date,i,n)))S.date=firstOpen(n)};

/* ===== СОСТОЯНИЕ ===== */
const blank=()=>({step:0,service:null,barber:'any',date:firstOpen(),time:null,name:'',phone:'',done:null});
let S=blank();
const STEPS=['Услуга','Мастер','Дата и время','Контакты','Проверка'];

/* ===== КОМПОНЕНТЫ ===== */
const Btn=(t,a,c='')=>`<button class="btn ${c}" data-a="${a}">${t}</button>`;
const bookable=s=>s.bookable!==false;
const ServiceCard=s=>`<article class="card svc">${s.photo||s.icon?`<div class="art">${icon(s.icon,54)}${s.photo?img(s.photo,s.name):''}</div>`:''}<h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="meta"><b>${priceLabel(s)}</b>${SHOW_DUR&&bookable(s)?`<span>${s.duration} мин</span>`:''}</div>${bookable(s)?Btn('Записаться','pick:'+s.id,'full'):''}</article>`;
const ServiceGrid=list=>{const cats=[...new Set(list.map(s=>s.category||''))];return cats.map(c=>`${c?`<h3 class="cat">${esc(c)}</h3>`:''}<div class="grid g3">${list.filter(s=>(s.category||'')===c).map(ServiceCard).join('')}</div>`).join('')};

const Info=(i,t,v)=>`<div class="info">${icon(i,22)}<div><b>${t}</b><span style="color:var(--mut)">${v}</span></div></div>`;
const SecHead=(t,l,to)=>`<div class="sec-h"><h2>${t}</h2>${l?`<button class="link" data-a="go:${to}">${l}</button>`:''}</div>`;
const popular=()=>{const p=SERVICES.filter(s=>s.popular);return(p.length?p:SERVICES.filter(bookable)).slice(0,3)};
const telHref='tel:+'+C.contacts.phone.replace(/\D/g,'');
const Messengers=()=>{const c=C.contacts,l=[];

function External(){const s=S.service&&svc(S.service),b=S.barber!=='any'&&brb(S.barber);
 return `<section class="view">${SecHead('Онлайн-запись')}<div class="card">

function Booking(){
 const st=S.step,s=S.service&&svc(S.service);let body='';
 if(st===0)body=SERVICES.filter(bookable).map(x=>`<button class="card opt ${S.service===x.id?'sel':''}" data-a="svc:${x.id}"><span class="ic">${icon(x.icon,28)}${x.photo?img(x.photo,x.name):''}</span><span class="t"><b>${esc(x.name)}</b>${SHOW_DUR?`<span>${x.duration} мин</span>`:''}</span><span class="p">${priceLabel(x)}</span></button>`).join('<div style="height:10px"></div>');
 if(st===1)body=[['any','Любой свободный мастер','Подберём ближайшее время'],...BARBERS.map(b=>[b.id,b.name,b.role])].map(([id,n,r])=>`<button class="card opt ${S.barber===id?'sel':''}" data-a="brb:${id}"><span class="ic">${id==='any'?icon('star',24):`<span class="ph">${barberPic(brb(id))}</span>`}</span><span class="t"><b>${esc(n)}</b><span>${esc(r)}</span></span></button>`).join('<div style="height:10px"></div>');
 if(st===2){const n=nSlots(),sl=slotsFor(S.date);
  body=`<span class="lab">Дата</span><div class="dates">${days.map(d=>{const k=dkey(d);return `<button class="date ${S.date===k?'sel':''}" ${hoursOf(d)?'':'disabled'} data-a="date:${k}"><small>${d.toLocaleDateString('ru-RU',{weekday:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('ru-RU',{month:'short'})}</small></button>`}).join('')}</div>
  <span class="lab" style="margin-top:14px">Свободное время${SHOW_DUR?` (${s.duration} мин)`:''}</span>${sl.length?`<div class="slots">${sl.map((m,i)=>{const ok=slotFree(S.date,i,n);return `<button class="slot ${S.time===i?'sel':''}" ${ok?'':'disabled'} data-a="time:${i}">${hm(m)}</button>`}).join('')}</div>`:'<p>В этот день мы не работаем. Выберите другую дату.</p>'}`}
 if(st===3)body=`<label class="lab" for="nm">Ваше имя</label><input class="inp" id="nm" autocomplete="name" placeholder="Например, Иван" value="${esc(S.name)}"><label class="lab" for="ph">Телефон</label><input class="inp" id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" value="${esc(S.phone)}">`;
 if(st===4)body=`<div class="card">${summary()}</div>`;
 const last=st===4;
 return `<section class="view"><div class="bk-h"><button class="icon-b" data-a="back" aria-label="Назад">‹</button><div><h2 style="margin:0;font-size:26px">${STEPS[st]}</h2><span style="color:var(--mut);font-size:13px">Шаг ${st+1} из ${STEPS.length}</span></div></div>
 <div class="bar"><i style="width:${(st+1)/STEPS.length*100}%"></i></div><div style="height:14px"></div>${body}
 <div class="cta"><button class="btn full" id="next" data-a="${last?'confirm':'next'}" ${valid()?'':'disabled'}>${last?'Подтвердить запись':'Продолжить'}</button></div></section>`}
const valid=()=>[!!S.service,true,S.time!==null,S.name.trim().length>1&&S.phone.replace(/\D/g,'').length===11,true][S.step];
function summary(b=S.barber==='any'?null:brb(S.barber)){const s=svc(S.service),d=new Date(S.date+'T12:00'),t=slotsFor(S.date)[S.time];
 const r=(a,v)=>`<div class="sum"><span>${a}</span><b>${esc(v)}</b></div>`;
 return r('Услуга',s.name)+r('Мастер',b?b.name:'Любой свободный')+r('Дата',d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}))+r('Время',hm(t)+' – '+hm(t+s.duration))+r('Клиент',S.name+', '+S.phone)+r('К оплате в салоне',priceLabel(s))}
function Done(){const d=S.done;return `<section class="view ok"><div class="ring"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2 style="margin:0 0 6px">Вы записаны</h2><p>Номер записи ${d.num}. Ждём вас, ${esc(S.name.trim())}.</p><div class="card" style="text-align:left;margin:22px 0">${summary(d.barber)}</div><div class="row" style="justify-content:center">${Btn('На главную','done:home')}${Btn('Новая запись','done:booking','ghost')}</div></section>`}

const A={
 gal:v=>{const g=$('#gal'),f=g&&g.querySelector('figure');if(f)g.scrollBy({left:(+v)*(f.offsetWidth+12),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})},
 go:v=>{location.hash=v},
 pick:v=>{S=blank();S.service=v;fitDate();S.step=1;A.go('booking');render()},
 pickb:v=>{S=blank();S.barber=v;A.go('booking');render()},
 svc:v=>{S.service=v;S.time=null;fitDate();render()},
 brb:v=>{S.barber=v;S.time=null;if(S.service)fitDate();render()},
 date:v=>{S.date=v;S.time=null;render()},
 time:v=>{S.time=+v;render()},
 next:()=>{if(valid()){S.step++;render()}},
 back:()=>{if(S.step>0){S.step--;render()}else A.go('home')},
 confirm:()=>{const n=nSlots(),i=S.time;let b=S.barber==='any'?BARBERS.find(x=>free(x.id,S.date,i,n)):brb(S.barber);
  if(!b||!free(b.id,S.date,i,n)){S.step=2;S.time=null;render();return}
  for(let j=0;j<n;j++)booked[S.date+b.id+(i+j)]=1;
  S.done={barber:b,num:(C.brand.monogram||'BH')+'-'+(1000+Math.random()*9000|0)};render()},
 done:v=>{S=blank();A.go(v);render()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const[a,v]=el.dataset.a.split(':');A[a](v)});
document.addEventListener('input',e=>{
 if(e.target.id==='nm')S.name=e.target.value;
 if(e.target.id==='ph'){let d=e.target.value.replace(/\D/g,'');if(/^[78]/.test(d))d=d.slice(1);d=d.slice(0,10);
  let f=d?'+7 ('+d.slice(0,3):'';if(d.length>=3)f+=') '+d.slice(3,6);if(d.length>6)f+='-'+d.slice(6,8);if(d.length>8)f+='-'+d.slice(8,10);
  e.target.value=f;S.phone=f}
 if(e.target.id){const b=$('#next');if(b)b.disabled=!valid()}});

if(C.decor==='tools'&&!matchMedia('(prefers-reduced-motion:reduce)').matches)(()=>{
 const cv=$('#decor'),ctx=cv.getContext('2d');cv.hidden=false;
 const P=['M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M15 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M8.1 15.9L20 4M15.9 15.9L4 4', // ножницы
  'M8 9h8v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM7 6h10v3H7zM8 3v3M10 3v3M12 3v3M14 3v3M16 3v3M11 14h2', // машинка
  'M12 13c-1.5-2.5-4-3.2-6-2-1.6 1-2 3-4 3 1 2 4 3 6 2 2-.8 3-2 4-3zM12 13c1.5-2.5 4-3.2 6-2 1.6 1 2 3 4 3-1 2-4 3-6 2-2-.8-3-2-4-3z', // усы
  'M3 8h18v4H3zM5 12v7M8 12v7M11 12v7M14 12v7M17 12v7M20 12v5', // расчёска
  'M3 15l10-6 2 3-10 6zM13 9l5-3a2 2 0 0 1 3 1.5L15 12', // опасная бритва
  'M9 9h6v12H9zM10 9V6h4v3M14 7h3M18 5l2-1M18 7h2M18 9l2 1', // спрей
  'M9 3h6l-1 8h-4zM10 11h4v3h-4zM9 14h6l-1 7h-4z' // помазок
 ].map(d=>new Path2D(d));
 let W,H,dpr,zones=[],items=[],last=0,col='#c8a15a',running=false;
 const rnd=(a,b)=>a+Math.random()*(b-a);
 const spawn=(top)=>{const z=zones[Math.random()*zones.length|0];return{x:rnd(z[0]+20,z[1]-20),y:top?rnd(-H,H):rnd(-120,-40),s:rnd(1.6,2.8),r:rnd(0,6.28),vr:rnd(-.6,.6),vy:rnd(18,42),sw:rnd(0,6.28),a:rnd(.18,.42),p:P[Math.random()*P.length|0],z}};
 const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const r=document.querySelector('.wrap').getBoundingClientRect();zones=[];if(r.left>90)zones.push([0,r.left-10]);if(W-r.right>90)zones.push([r.right+10,W]);
  const n=zones.length?Math.round(zones.reduce((t,z)=>t+(z[1]-z[0]),0)*H/26000):0;items=Array.from({length:Math.min(n,60)},()=>spawn(true));
  col=getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||col};
 const frame=t=>{const dt=Math.min((t-last)/1000,.05);last=t;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';
  for(const it of items){it.y+=it.vy*dt;it.r+=it.vr*dt;it.sw+=dt;const x=it.x+Math.sin(it.sw)*10;
   if(it.y>H+60)Object.assign(it,spawn(false));
   ctx.save();ctx.globalAlpha=it.a;ctx.translate(x,it.y);ctx.rotate(it.r);ctx.scale(it.s,it.s);ctx.translate(-12,-12);ctx.lineWidth=1.5/it.s*1.2;ctx.stroke(it.p);ctx.restore()}
  if(items.length&&!document.hidden)requestAnimationFrame(frame);else{running=false;ctx.clearRect(0,0,W,H)}};
 const start=()=>{size();if(items.length&&!running){running=true;last=performance.now();requestAnimationFrame(frame)}};
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)start()});
 let to;addEventListener('resize',()=>{clearTimeout(to);to=setTimeout(start,150)});start()})();
if(col.texture){R.setProperty('--tex',`url('${col.texture}')`);document.body.classList.add('tex')}

const NAV=[['home','Главная','home'],['services','Услуги','list'],['booking','Запись','cal'],['contacts','Контакты','phone']];
function render(){let r=location.hash.slice(1);if(!views[r])r='home';

/* ===== НИЖНЕЕ МЕНЮ «ЖИДКОЕ СТЕКЛО» С ПЕРЕТАСКИВАЕМЫМ ПОЛЗУНКОМ ===== */
let navIdx=0;
function buildNav(){const nav=$('#nav');
 nav.innerHTML='<span class="pill" id="pill"></span>'+NAV.map(([id,t,i])=>`<a href="#${id}" draggable="false">${icon(i,22)}${t}</a>`).join('');
 const pill=$('#pill'),links=[...nav.querySelectorAll('a')];let drag=null;
 const step=()=>links[0].offsetWidth, max=()=>(NAV.length-1)*step();
 const idxAt=x=>{const r=nav.getBoundingClientRect();return Math.max(0,Math.min(NAV.length-1,Math.floor((x-r.left-6)/step())))};
 nav.addEventListener('pointerdown',e=>{drag={x0:e.clientX,start:navIdx*step(),pos:navIdx*step(),moved:false,id:e.pointerId};pill.classList.add('drag')});
 nav.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0;
  if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;try{nav.setPointerCapture(drag.id)}catch(_){}}
  if(!drag.moved)return;drag.pos=Math.max(0,Math.min(max(),drag.start+dx));pill.style.setProperty('--x',drag.pos+'px');
  const near=Math.round(drag.pos/step());links.forEach((a,k)=>a.classList.toggle('on',k===near))});
 const end=e=>{if(!drag)return;pill.classList.remove('drag');const d=drag;drag=null;
  const i=d.moved?Math.round(d.pos/step()):idxAt(e.clientX);
  if(d.moved||e.type==='pointerup'){navIdx=i;placePill();if(location.hash.slice(1)!==NAV[i][0])location.hash=NAV[i][0]}};
 nav.addEventListener('pointerup',end);nav.addEventListener('pointercancel',e=>{if(drag){drag=null;pill.classList.remove('drag');placePill()}});
 nav.addEventListener('click',e=>{if(e.detail!==0)e.preventDefault()}); // мышь и палец обрабатываем сами, клавиатура — как обычно
 addEventListener('resize',placePill)}
function placePill(){const nav=$('#nav'),links=[...nav.querySelectorAll('a')];$('#pill').style.setProperty('--x',navIdx*links[0].offsetWidth+'px');links.forEach((a,k)=>a.classList.toggle('on',k===navIdx))}
function setNav(r){if(!$('#pill'))buildNav();const i=NAV.findIndex(n=>n[0]===r);navIdx=i<0?0:i;placePill()}
function bindGal(){const g=$('#gal');if(!g)return;const bar=$('#gbar'),pv=$('.gnav.prev'),nx=$('.gnav.next');
 const upd=()=>{const max=g.scrollWidth-g.clientWidth,w=g.clientWidth/g.scrollWidth;bar.style.width=(w*100)+'%';bar.style.left=(max>0?g.scrollLeft/max*(1-w)*100:0)+'%';pv.disabled=g.scrollLeft<4;nx.disabled=g.scrollLeft>max-4};
 g.addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd()}
let prev='';addEventListener('hashchange',()=>{const r=location.hash;if(r!==prev)scrollTo(0,0);prev=r;render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
